name: joule-kitchen
services:
  mock:
    build:
      context: .
      target: mock
    environment:
      MOCK_BIND: 0.0.0.0
      PORT: '4173'
    ports:
      - '127.0.0.1:4173:4173'
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [simulation]
networks:
  simulation:
    internal: true
