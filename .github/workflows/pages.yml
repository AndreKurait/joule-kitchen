name: Test and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck, protocol tests, history tests and build
        run: npm run check
      - name: Docker UI tests against simulated GATT
        run: npm run test:docker
      - name: Container logs
        if: failure()
        run: docker compose -f compose.yaml -f compose.test.yaml logs --no-color
      - name: Collect browser traces on failure
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose -f compose.yaml -f compose.test.yaml cp ui-tests:/app/test-results artifacts/test-results || true
          docker compose -f compose.yaml -f compose.test.yaml cp ui-tests:/app/playwright-report artifacts/playwright-report || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: browser-failure-artifacts
          path: artifacts
          retention-days: 7
      - name: Stop test containers
        if: always()
        run: npm run test:docker:down
      - name: Upload static site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
